<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" rx="20"/>
  <rect x="20" y="20" width="600" height="320" fill="none" stroke="url(#accent)" stroke-width="2" rx="12" opacity="0.5"/>
  <text x="320" y="145" text-anchor="middle" fill="url(#accent)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="800" filter="url(#glow)">Cursor is the best</text>
  <text x="320" y="225" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700">Cursor for the win!</text>
  <text x="320" y="305" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20">? AI-powered coding</text>
</svg>
