<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" style="stop-color:#2a3036"/>
      <stop offset="60%" style="stop-color:#1e2328"/>
      <stop offset="100%" style="stop-color:#14171a"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f5f7"/>
      <stop offset="100%" style="stop-color:#b0b5bb"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="shadowIcon" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- Standard mouse cursor outline (arrow pointing up-left) -->
    <path id="cursorIcon" d="M0 0 L12 0 L12 4 L6 4 L6 18 L2 14 L2 4 L0 4 Z" fill="none" stroke="url(#textGrad)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="url(#textGrad)">
    <text x="320" y="142" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="400">Cursor is the <tspan font-size="52" font-weight="800">BEST!</tspan></text>
    <text x="320" y="222" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="400">Cursor for the <tspan font-size="52" font-weight="800">WIN!</tspan></text>
  </g>
  <g filter="url(#shadowIcon)" transform="translate(422, 92)">
    <use href="#cursorIcon" transform="scale(3.5)"/>
  </g>
</svg>
